<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scientific Calculator App</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="calculator-container">
        <header class="app-header">
            <span class="app-title">Scientific Calculator</span>
            <span class="badge">DevOps CI/CD</span>
        </header>
        
        <div class="display-panel">
            <div id="expression" class="expression-line"></div>
            <div id="display" class="result-line">0</div>
        </div>

        <div class="keypad">
            <!-- Row 1: Scientific & Utility Functions -->
            <button class="btn btn-func" onclick="clearAll()" id="btn-clear">C</button>
            <button class="btn btn-func" onclick="backspace()" id="btn-backspace">⌫</button>
            <button class="btn btn-func" onclick="appendOp('%')" id="btn-percent">%</button>
            <button class="btn btn-op" onclick="appendOp('/')" id="btn-divide">÷</button>

            <!-- Row 2: Scientific Functions -->
            <button class="btn btn-scientific" onclick="calcFunc('sin')">sin</button>
            <button class="btn btn-scientific" onclick="calcFunc('cos')">cos</button>
            <button class="btn btn-scientific" onclick="calcFunc('tan')">tan</button>
            <button class="btn btn-scientific" onclick="calcFunc('sqrt')">√</button>

            <!-- Row 3: Numbers & Basic Operators -->
            <button class="btn btn-num" onclick="appendNum('7')">7</button>
            <button class="btn btn-num" onclick="appendNum('8')">8</button>
            <button class="btn btn-num" onclick="appendNum('9')">9</button>
            <button class="btn btn-op" onclick="appendOp('*')">×</button>

            <!-- Row 4: Numbers & Basic Operators -->
            <button class="btn btn-num" onclick="appendNum('4')">4</button>
            <button class="btn btn-num" onclick="appendNum('5')">5</button>
            <button class="btn btn-num" onclick="appendNum('6')">6</button>
            <button class="btn btn-op" onclick="appendOp('-')">−</button>

            <!-- Row 5: Numbers & Basic Operators -->
            <button class="btn btn-num" onclick="appendNum('1')">1</button>
            <button class="btn btn-num" onclick="appendNum('2')">2</button>
            <button class="btn btn-num" onclick="appendNum('3')">3</button>
            <button class="btn btn-op" onclick="appendOp('+')">+</button>

            <!-- Row 6: Negate, 0, Decimal, Equals -->
            <button class="btn btn-func" onclick="toggleSign()">±</button>
            <button class="btn btn-num" onclick="appendNum('0')">0</button>
            <button class="btn btn-num" onclick="appendDot()">.</button>
            <button class="btn btn-equals" onclick="calculateResult()" id="btn-equals">=</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
