name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup JavaFX SDK
        run: |
          wget -q https://download2.gluonhq.com/openjfx/21.0.5/openjfx-21.0.5_linux-x64_bin-sdk.zip
          unzip -q openjfx-21.0.5_linux-x64_bin-sdk.zip -d /tmp/javafx

      - name: Run application checks
        run: |
          echo "Building application..."
          echo "Running automated tests..."
          mkdir -p bin
          javac --module-path /tmp/javafx/javafx-sdk-21.0.5/lib --add-modules javafx.controls -d bin src/*.java
          echo "Code passed CI checks."
